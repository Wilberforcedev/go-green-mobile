name: Flutter and Supabase checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name grinmates_mobile .
      - name: Verify release network permission
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - name: Build Android release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations and test database policies
        run: |
          supabase db reset
          supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
